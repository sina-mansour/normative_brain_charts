name: snm_env
channels:
  - conda-forge
dependencies:
  - python=3.10.18
  - pip=25.1.1
  # Core scientific
  - numpy=1.26.4
  - scikit-learn=1.7.0
  - joblib=1.5.2
  - numba=0.62.1
  # Data analysis
  - pandas=2.3.3
  - polars=1.33.1
  - pyarrow=21.0.0
  - openpyxl=3.1.5
  - xlrd=2.0.2
  - h5py=3.15.1
  # Visualization
  - matplotlib=3.10.7
  - seaborn=0.13.2
  - colorcet=3.1.0
  - datashader=0.18.2
  - holoviews=1.21.0
  - opencv=4.12.0
  # Neuroimaging
  - nibabel=5.3.2
  - nilearn=0.12.1
  # Bayesian modelling
  - pymc=5.25.1
  - pytensor=2.31.7
  - arviz=0.22.0
  - xarray=2025.6.1
  # Notebook environment
  - jupyterlab=4.4.10
  - ipykernel=6.31.0
  - ipywidgets=8.1.7
  # Progress tracking
  - tqdm=4.67.1
  # Data access
  - boto3=1.39.3
  - datalad=1.2.1
  - globus-sdk=4.3.1
  - urllib3=2.5.0
  - requests=2.32.5
  # Pip-only packages
  - pip:
    - scipy==1.15.3
    - spectranorm==0.1.3
    - connectome-spatial-smoothing==0.1.6
    - cerebro-viewer==0.0.10.5
    - neuromaps==0.0.5
    - brainsmash==0.11.0
    - gdist==2.1.0
    - trimesh==4.6.13
    - diptest==0.10.0
    - plotly==5.24.0
    - pillow==12.0.0
    - statsmodels==0.14.6
    - scikit-image==0.25.2

